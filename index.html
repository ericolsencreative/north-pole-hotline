<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>North Pole Hotline</title>
<style>
  :root { --red:#b3192b; --cream:#fff6e6; --ginger:#8a4b1f; --gold:#f2c14e; --green:#2d6a3e; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; background:var(--red); color:var(--cream); font-family: Georgia, "Times New Roman", serif; overflow:hidden; }
  #app { height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px; gap:18px; }
  h1 { margin:0; font-size:2.2rem; letter-spacing:.06em; text-transform:uppercase; }
  h1 small { display:block; font-size:1rem; letter-spacing:.2em; opacity:.85; margin-top:6px; }
  #orb { width:160px; height:160px; border-radius:50%; background:var(--cream); display:flex; align-items:center; justify-content:center; font-size:78px; box-shadow:0 0 0 12px rgba(255,255,255,.12); transition: box-shadow .4s, transform .4s; }
  body.listening #orb { box-shadow:0 0 0 22px rgba(242,193,78,.35); }
  body.speaking  #orb { box-shadow:0 0 0 34px rgba(255,255,255,.28); transform:scale(1.06); animation:pulse 1.1s infinite alternate; }
  @keyframes pulse { to { transform:scale(1.12); } }
  #status { font-size:1.3rem; min-height:1.6em; }
  #arm { font: inherit; font-size:1.4rem; padding:18px 36px; border:0; border-radius:999px; background:var(--gold); color:#3a1d05; cursor:pointer; box-shadow:0 6px 0 #b98a2a; }
  #arm:active { transform:translateY(3px); box-shadow:0 3px 0 #b98a2a; }
  .hidden { display:none !important; }
  #log { position:fixed; left:0; right:0; bottom:0; max-height:28vh; overflow:auto; background:rgba(0,0,0,.55); color:#ddd; font:11px/1.4 monospace; padding:6px 10px; text-align:left; }
  #meta { position:fixed; top:8px; right:10px; font:11px monospace; opacity:.6; }
</style>
</head>
<body>
<div id="app">
  <h1>North Pole Hotline<small>Tell Santa your Christmas wishes</small></h1>
  <div id="orb">🎅</div>
  <div id="status">Waking up the elves…</div>
  <button id="arm">Tap once to open the line</button>
</div>
<div id="meta"></div>
<div id="log" class="hidden"></div>

<script type="module">
/* =======================================================================
   NORTH POLE HOTLINE — kiosk page for an ElevenLabs agent
   Edit the CONFIG block, host this file anywhere (GitHub Pages is fine),
   open it in Chrome or Fully Kiosk Browser on the Android, tap once.
   ======================================================================= */
const CONFIG = {
  AGENT_ID: "agent_2401kb3jpnvmejs9ma57ra41b85r",

  // "always": Santa listens continuously; a new session starts whenever one ends.
  // "button": Santa waits; Enter key (Bluetooth shutter remote) or a screen tap starts a call.
  MODE: "always",

  RESTART_DELAY_MS: 1500,     // pause between one conversation ending and the next starting
  CONNECT_TIMEOUT_MS: 25000,  // if "connecting" lasts longer than this, reload the page
  MAX_CALL_MINUTES: 4,        // hard stop per conversation (also set a limit in the agent's settings)
  RELOAD_EVERY_HOURS: 3,      // full page reload to clear any leaks; happens only while idle/disconnected
  SHOW_LOG: true,             // debug log at the bottom of the screen; set false for the real display
  TIMEZONE: "America/Los_Angeles",
};

/* ---------- load the ElevenLabs client from a CDN (no build step) ---------- */
let Conversation;
try {
  ({ Conversation } = await import("https://esm.sh/@elevenlabs/client"));
} catch (e) {
  setStatus("Could not load ElevenLabs library. Check Wi-Fi, then reload.");
  log("import failed: " + e);
  throw e;
}

/* ---------- small helpers ---------- */
const $ = (id) => document.getElementById(id);
const statusEl = $("status"), armBtn = $("arm"), logEl = $("log"), metaEl = $("meta");
if (CONFIG.SHOW_LOG) logEl.classList.remove("hidden");

function log(msg) {
  const line = `[${new Date().toLocaleTimeString()}] ${msg}`;
  console.log(line);
  if (!CONFIG.SHOW_LOG) return;
  logEl.textContent = (line + "\n" + logEl.textContent).slice(0, 6000);
}
function setStatus(t) { statusEl.textContent = t; }
function setMode(m) { document.body.classList.remove("listening", "speaking"); if (m) document.body.classList.add(m); }

function santaVariables() {
  const now = new Date();
  const local = new Date(now.toLocaleString("en-US", { timeZone: CONFIG.TIMEZONE }));
  const year = local.getFullYear();
  let xmas = new Date(year, 11, 25);
  if (local > new Date(year, 11, 25, 23, 59)) xmas = new Date(year + 1, 11, 25);
  const sleeps = Math.max(0, Math.ceil((xmas - local) / 86400000));
  const h = local.getHours();
  const time_of_day = h < 12 ? "morning" : h < 17 ? "afternoon" : "evening";
  return {
    sleeps_until_christmas: String(sleeps),
    time_of_day,
    todays_date: local.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" }),
  };
}

/* ---------- keep the screen awake (Chrome supports this; Fully Kiosk has its own setting) ---------- */
let wakeLock = null;
async function keepAwake() {
  try {
    if ("wakeLock" in navigator) {
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", () => log("wake lock released"));
      log("wake lock on");
    }
  } catch (e) { log("wake lock unavailable: " + e.message); }
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && !wakeLock) keepAwake(); });

/* ---------- the loop ---------- */
let conversation = null;
let state = "disarmed";          // disarmed | idle | connecting | live | ending
let armed = false;
let sessions = 0, failures = 0;
let connectTimer = null, callTimer = null, restartTimer = null;
const bootedAt = Date.now();

function meta() {
  metaEl.textContent = `mode:${CONFIG.MODE} state:${state} calls:${sessions} fails:${failures}`;
}

async function startCall(reason) {
  if (!armed || state === "connecting" || state === "live") return;
  clearTimeout(restartTimer);
  state = "connecting"; meta();
  setStatus("Connecting to the North Pole…");
  setMode(null);
  log(`startCall (${reason})`);

  connectTimer = setTimeout(() => {
    log("connect timeout -> reloading page");
    location.reload();
  }, CONFIG.CONNECT_TIMEOUT_MS);

  try {
    conversation = await Conversation.startSession({
      agentId: CONFIG.AGENT_ID,
      connectionType: "webrtc",
      dynamicVariables: santaVariables(),
      onConnect: () => {
        clearTimeout(connectTimer);
        state = "live"; sessions++; failures = 0; meta();
        setStatus("Santa is on the line. Say hello!");
        setMode("listening");
        log("connected");
        callTimer = setTimeout(() => {
          log("max call length reached -> ending");
          endCall("max length");
        }, CONFIG.MAX_CALL_MINUTES * 60000);
      },
      onDisconnect: (d) => {
        clearTimeout(connectTimer); clearTimeout(callTimer);
        log("disconnected: " + (d && d.reason ? d.reason : JSON.stringify(d || {})));
        afterCall();
      },
      onError: (err) => {
        log("error: " + (err && err.message ? err.message : JSON.stringify(err)));
      },
      onModeChange: (m) => {
        setMode(m.mode === "speaking" ? "speaking" : "listening");
        setStatus(m.mode === "speaking" ? "Santa is talking…" : "Santa is listening…");
      },
      onStatusChange: (s) => log("status: " + s.status),
    });
  } catch (e) {
    clearTimeout(connectTimer);
    failures++; meta();
    log("startSession failed: " + (e && e.message ? e.message : e));
    afterCall(true);
  }
}

async function endCall(reason) {
  if (!conversation) return;
  log("endCall (" + reason + ")");
  state = "ending"; meta();
  try { await conversation.endSession(); } catch (e) { log("endSession error: " + e.message); }
  // onDisconnect normally fires and calls afterCall(); this is a safety net
  setTimeout(() => { if (state === "ending") afterCall(); }, 2000);
}

function afterCall(failed = false) {
  conversation = null;
  state = "idle"; meta();
  setMode(null);

  // periodic hygiene reload, only when nobody is mid-conversation
  if (Date.now() - bootedAt > CONFIG.RELOAD_EVERY_HOURS * 3600000) {
    log("scheduled reload");
    sessionStorage.setItem("autoarm", "1");
    location.reload();
    return;
  }

  if (CONFIG.MODE === "always") {
    const delay = failed ? Math.min(60000, CONFIG.RESTART_DELAY_MS * Math.pow(2, failures)) : CONFIG.RESTART_DELAY_MS;
    setStatus(failed ? "Line busy, trying again…" : "Santa is listening…");
    restartTimer = setTimeout(() => startCall("auto-restart"), delay);
  } else {
    setStatus("Press the button to call Santa");
  }
}

/* ---------- arming: one human gesture unlocks the mic and audio for the whole evening ---------- */
async function arm() {
  if (armed) return;
  try {
    const s = await navigator.mediaDevices.getUserMedia({ audio: true });
    s.getTracks().forEach(t => t.stop());
  } catch (e) {
    setStatus("Microphone permission is required. Tap again and allow it.");
    log("mic permission denied: " + e.message);
    return;
  }
  armed = true;
  armBtn.classList.add("hidden");
  await keepAwake();
  log("armed");
  if (CONFIG.MODE === "always") startCall("armed");
  else setStatus("Press the button to call Santa");
}
armBtn.addEventListener("click", arm);

// After a scheduled reload, Chrome usually remembers the mic permission, so try to re-arm without a tap.
if (sessionStorage.getItem("autoarm")) {
  sessionStorage.removeItem("autoarm");
  arm().catch(() => {});
}

/* ---------- physical trigger: Bluetooth shutter remote sends Enter; screen tap also works ---------- */
function trigger(src) {
  if (!armed) { arm(); return; }
  if (CONFIG.MODE !== "button") return;
  if (state === "live" || state === "connecting") endCall(src); else startCall(src);
}
document.addEventListener("keydown", (e) => {
  if (["Enter", " ", "NumpadEnter"].includes(e.key) || e.key === "Enter") { e.preventDefault(); trigger("key:" + e.key); }
});
$("orb").addEventListener("click", () => trigger("tap"));

// Fully Kiosk: expose a couple of hooks for its REST API / volume-button binding if you ever want them
window.santa = { startCall, endCall, status: () => state, config: CONFIG };
if (window.fully && typeof fully.bind === "function") {
  try { fully.bind("volumeUp", "window.santa.startCall('fully:volumeUp');"); } catch (e) {}
}

meta();
setStatus("Tap once to open the line");
</script>
</body>
</html>
