<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>North Pole Hotline</title>
<style>
  :root { --red:#b3192b; --cream:#fff6e6; --gold:#f2c14e; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; background:var(--red); color:var(--cream); font-family: Georgia, "Times New Roman", serif; overflow:hidden; }
  #app { height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px; gap:18px; }
  h1 { margin:0; font-size:2.2rem; letter-spacing:.06em; text-transform:uppercase; }
  h1 small { display:block; font-size:1rem; letter-spacing:.2em; opacity:.85; margin-top:6px; }
  #orb { width:160px; height:160px; border-radius:50%; background:var(--cream); display:flex; align-items:center; justify-content:center; font-size:78px; box-shadow:0 0 0 12px rgba(255,255,255,.12); transition: box-shadow .4s, transform .4s; }
  body.ringing   #orb { animation:shake .25s infinite; }
  body.listening #orb { box-shadow:0 0 0 22px rgba(242,193,78,.35); }
  body.speaking  #orb { box-shadow:0 0 0 34px rgba(255,255,255,.28); transform:scale(1.06); animation:pulse 1.1s infinite alternate; }
  @keyframes pulse { to { transform:scale(1.12); } }
  @keyframes shake { 0%{transform:rotate(-6deg)} 50%{transform:rotate(6deg)} 100%{transform:rotate(-6deg)} }
  #status { font-size:1.3rem; min-height:1.6em; }
  #arm { font: inherit; font-size:1.4rem; padding:18px 36px; border:0; border-radius:999px; background:var(--gold); color:#3a1d05; cursor:pointer; box-shadow:0 6px 0 #b98a2a; }
  #arm:active { transform:translateY(3px); box-shadow:0 3px 0 #b98a2a; }
  .hidden { display:none !important; }
  #log { position:fixed; left:0; right:0; bottom:0; max-height:28vh; overflow:auto; background:rgba(0,0,0,.55); color:#ddd; font:11px/1.4 monospace; padding:6px 10px; text-align:left; }
  #meta { position:fixed; top:8px; right:10px; font:11px monospace; opacity:.6; }
  #vu { position:fixed; top:8px; left:10px; width:120px; height:6px; background:rgba(0,0,0,.3); }
  #vu i { display:block; height:100%; width:0; background:var(--gold); }
</style>
</head>
<body>
<div id="app">
  <h1>North Pole Hotline<small>Tell Santa your Christmas wishes</small></h1>
  <div id="orb">🎅</div>
  <div id="status">Waking up the elves…</div>
  <button id="arm">Tap once to open the line</button>
</div>
<div id="meta"></div>
<div id="vu"><i></i></div>
<div id="log" class="hidden"></div>

<script type="module">
/* =======================================================================
   NORTH POLE HOTLINE — kiosk page for an ElevenLabs agent

   URL switches (no editing needed):
     ?agent=test      use the 2026 TEST agent instead of last year's
     ?mode=voice      ring + answer when the page hears a voice nearby (default)
     ?mode=button     ring + answer on Enter key (Bluetooth remote) or a screen tap
     ?mode=always     keep a session open continuously (no ring; Santa greets on each restart)
     ?log=0           hide the debug log
     ?open=8&close=22 office hours in local 24h time (default 8 am to 10 pm); asleep otherwise
   ======================================================================= */
const AGENTS = {
  live: "agent_2401kb3jpnvmejs9ma57ra41b85r",   // last year's Santa
  test: "agent_3701m75zvsq1fenvn0vgr9wefdye",   // North Pole Hotline 2026 (TEST)
};
const q = new URLSearchParams(location.search);

const CONFIG = {
  AGENT_ID: AGENTS[q.get("agent")] || AGENTS.live,
  MODE: q.get("mode") || "voice",           // voice | button | always
  SHOW_LOG: q.get("log") !== "0",

  RINGS: 2,                     // how many rings before Santa picks up
  RING_ON_MS: 1100, RING_OFF_MS: 700,

  // voice trigger: how loud and how long someone must talk near the crate before Santa answers
  VOICE_THRESHOLD: 0.045,       // 0..1 RMS; raise if traffic triggers it, lower if kids can't trigger it
  VOICE_HOLD_MS: 500,           // must stay above threshold this long
  VOICE_COOLDOWN_MS: 4000,      // ignore sound for this long after a call ends (Santa's own goodbye, etc.)

  // office hours (local time, 24h). Outside them Santa is "asleep": no ring, no calls, nothing billed.
  OPEN_HOUR:  Number(q.get("open")  ?? 8),    // ?open=16 to start at 4 pm
  CLOSE_HOUR: Number(q.get("close") ?? 22),   // ?close=21 to stop at 9 pm

  RESTART_DELAY_MS: 1500,       // always-mode gap between sessions
  CONNECT_TIMEOUT_MS: 25000,    // reload the page if "connecting" hangs this long
  MAX_CALL_MINUTES: 4,          // page-side hard stop (agent also has its own 240 s limit)
  RELOAD_EVERY_HOURS: 3,        // hygiene reload while idle
  TIMEZONE: "America/Los_Angeles",
};

const TOPICS = [
  "cookies: which kind they will leave out, and milk or water for Santa",
  "carrots for the reindeer: which reindeer is hungriest, does Rudolph get extra",
  "weather: Santa's beard freezes at the North Pole; is Escondido really warm in December",
  "surfing Santa: Santa is trying to learn to surf in California and it is not going well",
  "palm trees: are there palm trees on their street; reindeer scratch their antlers on them",
  "chimney or magic key: do they have a chimney, or should Santa bring the magic key",
  "sleigh speed: faster than a car or faster than a rocket",
  "elf games: the elves play hide and seek in the toy piles; what game do they like",
  "helping at home: have they helped mom or dad with anything lately",
  "sharing: have they shared a toy or snack with a friend, brother or sister",
  "kindness: something kind they did for someone this week",
  "bedtime: do they go to bed on time, since Santa only comes when children are asleep",
  "snow: have they ever seen real snow; Santa has more than he knows what to do with",
  "Christmas tree: is it up yet, and who put the star on top",
  "pets: a pet at home Santa should say hello to on Christmas Eve",
  "Mrs. Claus is baking today: gingerbread or sugar cookies",
  "reindeer names: can they name any of the reindeer",
  "favorite Christmas song: the elves sing while they work",
  "lights: which house on their street has the best Christmas lights",
  "friends: what do they like to play with their friends",
  "hot chocolate: marshmallows or no marshmallows",
  "the workshop: what are the elves busiest building this year",
  "letters: did they write Santa a letter, or is this call their letter",
];

/* ---------- load the ElevenLabs client ---------- */
let Conversation;
try {
  ({ Conversation } = await import("https://esm.sh/@elevenlabs/client"));
} catch (e) {
  setStatus("Could not load ElevenLabs library. Check Wi-Fi, then reload.");
  log("import failed: " + e);
  throw e;
}

/* ---------- helpers ---------- */
const $ = (id) => document.getElementById(id);
const statusEl = $("status"), armBtn = $("arm"), logEl = $("log"), metaEl = $("meta"), vuEl = document.querySelector("#vu i");
if (CONFIG.SHOW_LOG) logEl.classList.remove("hidden");

function log(msg) {
  const line = `[${new Date().toLocaleTimeString()}] ${msg}`;
  console.log(line);
  if (CONFIG.SHOW_LOG) logEl.textContent = (line + "\n" + logEl.textContent).slice(0, 6000);
}
function setStatus(t) { statusEl.textContent = t; }
function setMode(m) { document.body.classList.remove("listening", "speaking", "ringing"); if (m) document.body.classList.add(m); }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const sleep = (ms) => new Promise(r => setTimeout(r, ms));

function localHour() {
  return new Date(new Date().toLocaleString("en-US", { timeZone: CONFIG.TIMEZONE })).getHours();
}
function isOpen() { const h = localHour(); return h >= CONFIG.OPEN_HOUR && h < CONFIG.CLOSE_HOUR; }
function pad(n) { return (n % 12 || 12) + (n < 12 || n === 24 ? " am" : " pm"); }

let lastTopics = [];
function santaVariables() {
  const now = new Date();
  const local = new Date(now.toLocaleString("en-US", { timeZone: CONFIG.TIMEZONE }));
  const year = local.getFullYear();
  let xmas = new Date(year, 11, 25);
  if (local > new Date(year, 11, 25, 23, 59)) xmas = new Date(year + 1, 11, 25);
  const sleeps = Math.max(0, Math.ceil((xmas - local) / 86400000));
  const h = local.getHours();
  // pick 3 topics, avoiding the previous call's 3 so back-to-back kids get different calls
  let pick = shuffle(TOPICS.filter(t => !lastTopics.includes(t))).slice(0, 3);
  lastTopics = pick;
  log("topics: " + pick.map(t => t.split(":")[0]).join(" | "));
  return {
    sleeps_until_christmas: String(sleeps),
    time_of_day: h < 12 ? "morning" : h < 17 ? "afternoon" : "evening",
    todays_date: local.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" }),
    topic_a: pick[0], topic_b: pick[1], topic_c: pick[2],
  };
}

/* ---------- audio: ring tone (classic North American ring, two tones) ---------- */
let actx = null;
function audio() { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === "suspended") actx.resume(); return actx; }
function ringOnce(ms) {
  const ctx = audio();
  const g = ctx.createGain(); g.gain.value = 0; g.connect(ctx.destination);
  const o1 = ctx.createOscillator(), o2 = ctx.createOscillator();
  o1.frequency.value = 440; o2.frequency.value = 480; o1.connect(g); o2.connect(g);
  const t = ctx.currentTime;
  g.gain.linearRampToValueAtTime(0.25, t + 0.03);
  // a little tremolo so it sounds like a bell, not a buzzer
  const lfo = ctx.createOscillator(), lg = ctx.createGain(); lfo.frequency.value = 20; lg.gain.value = 0.12; lfo.connect(lg); lg.connect(g.gain);
  g.gain.setValueAtTime(0.25, t + ms / 1000 - 0.05);
  g.gain.linearRampToValueAtTime(0, t + ms / 1000);
  o1.start(t); o2.start(t); lfo.start(t);
  o1.stop(t + ms / 1000); o2.stop(t + ms / 1000); lfo.stop(t + ms / 1000);
  return sleep(ms);
}
async function ring() {
  setMode("ringing"); setStatus("Ring… ring…");
  for (let i = 0; i < CONFIG.RINGS; i++) {
    await ringOnce(CONFIG.RING_ON_MS);
    if (i < CONFIG.RINGS - 1) await sleep(CONFIG.RING_OFF_MS);
  }
  await sleep(250); // the "click" of Santa picking up
}

/* ---------- keep the screen awake ---------- */
let wakeLock = null;
async function keepAwake() {
  try { if ("wakeLock" in navigator) { wakeLock = await navigator.wakeLock.request("screen"); log("wake lock on"); } }
  catch (e) { log("wake lock unavailable: " + e.message); }
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") keepAwake(); });

/* ---------- state ---------- */
let conversation = null;
let state = "disarmed";           // disarmed | idle | ringing | connecting | live | ending
let armed = false, sessions = 0, failures = 0;
let connectTimer = null, callTimer = null, restartTimer = null;
const bootedAt = Date.now();
function meta() { metaEl.textContent = `agent:${CONFIG.AGENT_ID === AGENTS.test ? "TEST" : "live"} mode:${CONFIG.MODE} state:${state} calls:${sessions} fails:${failures}`; }

/* ---------- local voice trigger (nothing leaves the phone) ---------- */
let vad = { stream: null, raf: null, above: 0, enabled: false, mutedUntil: 0 };
async function startVoiceWatch() {
  if (CONFIG.MODE !== "voice" || vad.enabled) return;
  try {
    vad.stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
    const ctx = audio();
    const src = ctx.createMediaStreamSource(vad.stream);
    const an = ctx.createAnalyser(); an.fftSize = 1024; src.connect(an);
    const buf = new Float32Array(an.fftSize);
    vad.enabled = true; vad.above = 0;
    const tick = () => {
      if (!vad.enabled) return;
      an.getFloatTimeDomainData(buf);
      let s = 0; for (let i = 0; i < buf.length; i++) s += buf[i] * buf[i];
      const rms = Math.sqrt(s / buf.length);
      vuEl.style.width = Math.min(100, rms * 800) + "%";
      const now = performance.now();
      if (now > vad.mutedUntil && rms > CONFIG.VOICE_THRESHOLD) {
        if (!vad.above) vad.above = now;
        if (now - vad.above > CONFIG.VOICE_HOLD_MS) { log(`voice detected (rms ${rms.toFixed(3)})`); stopVoiceWatch(); startCall("voice"); return; }
      } else vad.above = 0;
      vad.raf = requestAnimationFrame(tick);
    };
    vad.raf = requestAnimationFrame(tick);
    log("listening for a voice nearby");
    setStatus("Santa is waiting by the phone…");
  } catch (e) { log("voice watch failed: " + e.message); }
}
function stopVoiceWatch() {
  vad.enabled = false;
  if (vad.raf) cancelAnimationFrame(vad.raf);
  if (vad.stream) vad.stream.getTracks().forEach(t => t.stop());
  vad.stream = null; vuEl.style.width = "0";
}

/* ---------- the call ---------- */
async function startCall(reason) {
  if (!armed || ["ringing", "connecting", "live"].includes(state)) return;
  if (!isOpen()) { log(`startCall (${reason}) ignored: outside office hours`); goToSleep(); return; }
  clearTimeout(restartTimer);
  log(`startCall (${reason})`);

  if (CONFIG.MODE !== "always") { state = "ringing"; meta(); await ring(); }

  state = "connecting"; meta();
  setStatus("Connecting to the North Pole…"); setMode(null);
  connectTimer = setTimeout(() => { log("connect timeout -> reload"); location.reload(); }, CONFIG.CONNECT_TIMEOUT_MS);

  try {
    conversation = await Conversation.startSession({
      agentId: CONFIG.AGENT_ID,
      connectionType: "webrtc",
      dynamicVariables: santaVariables(),
      onConnect: () => {
        clearTimeout(connectTimer);
        state = "live"; sessions++; failures = 0; meta();
        setStatus("Santa is on the line!"); setMode("listening"); log("connected");
        callTimer = setTimeout(() => { log("page max call length -> ending"); endCall("max length"); }, CONFIG.MAX_CALL_MINUTES * 60000);
      },
      onDisconnect: (d) => {
        clearTimeout(connectTimer); clearTimeout(callTimer);
        log("disconnected: " + (d && d.reason ? d.reason : JSON.stringify(d || {})));
        afterCall();
      },
      onError: (err) => log("error: " + (err && err.message ? err.message : JSON.stringify(err))),
      onModeChange: (m) => { setMode(m.mode === "speaking" ? "speaking" : "listening"); setStatus(m.mode === "speaking" ? "Santa is talking…" : "Santa is listening…"); },
      onStatusChange: (s) => log("status: " + s.status),
    });
  } catch (e) {
    clearTimeout(connectTimer); failures++; meta();
    log("startSession failed: " + (e && e.message ? e.message : e));
    afterCall(true);
  }
}

async function endCall(reason) {
  if (!conversation) return;
  log("endCall (" + reason + ")"); state = "ending"; meta();
  try { await conversation.endSession(); } catch (e) { log("endSession error: " + e.message); }
  setTimeout(() => { if (state === "ending") afterCall(); }, 2000);
}

function afterCall(failed = false) {
  conversation = null; state = "idle"; meta(); setMode(null);
  if (!isOpen()) { goToSleep(); return; }

  if (Date.now() - bootedAt > CONFIG.RELOAD_EVERY_HOURS * 3600000) {
    log("scheduled reload"); sessionStorage.setItem("autoarm", "1"); location.reload(); return;
  }
  if (CONFIG.MODE === "always") {
    const delay = failed ? Math.min(60000, CONFIG.RESTART_DELAY_MS * Math.pow(2, failures)) : CONFIG.RESTART_DELAY_MS;
    setStatus(failed ? "Line busy, trying again…" : "Santa is listening…");
    restartTimer = setTimeout(() => startCall("auto-restart"), delay);
  } else if (CONFIG.MODE === "voice") {
    vad.mutedUntil = performance.now() + CONFIG.VOICE_COOLDOWN_MS;
    setStatus("Santa is waiting by the phone…");
    restartTimer = setTimeout(startVoiceWatch, failed ? 5000 : 800);
  } else {
    setStatus("Press the button to call Santa");
  }
}

/* ---------- office hours: asleep outside them, wakes itself up in the morning ---------- */
let asleep = false;
function goToSleep() {
  if (asleep) return;
  asleep = true; stopVoiceWatch(); clearTimeout(restartTimer); setMode(null);
  setStatus(`Santa is asleep. The hotline opens at ${pad(CONFIG.OPEN_HOUR)}.`);
  log("office hours: closed");
}
function wakeUp() {
  if (!asleep) return;
  asleep = false; log("office hours: open");
  if (CONFIG.MODE === "always") startCall("office hours open");
  else if (CONFIG.MODE === "voice") startVoiceWatch();
  else setStatus("Press the button to call Santa");
}
setInterval(() => {
  if (!armed) return;
  if (isOpen()) wakeUp();
  else if (state === "idle" || state === "disarmed") goToSleep();   // never cut off a live call
}, 60000);

/* ---------- arming: one human gesture unlocks mic + audio for the evening ---------- */
async function arm() {
  if (armed) return;
  try { const s = await navigator.mediaDevices.getUserMedia({ audio: true }); s.getTracks().forEach(t => t.stop()); }
  catch (e) { setStatus("Microphone permission is required. Tap again and allow it."); log("mic denied: " + e.message); return; }
  audio(); armed = true; armBtn.classList.add("hidden"); await keepAwake(); log("armed");
  if (!isOpen()) { goToSleep(); meta(); return; }
  if (CONFIG.MODE === "always") startCall("armed");
  else if (CONFIG.MODE === "voice") startVoiceWatch();
  else setStatus("Press the button to call Santa");
  meta();
}
armBtn.addEventListener("click", arm);
if (sessionStorage.getItem("autoarm")) { sessionStorage.removeItem("autoarm"); arm().catch(() => {}); }

/* ---------- physical trigger: Enter from a Bluetooth remote, or a tap on Santa ---------- */
function trigger(src) {
  if (!armed) { arm(); return; }
  if (state === "live" || state === "connecting") { endCall(src); return; }
  if (state === "idle") { stopVoiceWatch(); startCall(src); }
}
document.addEventListener("keydown", (e) => { if (["Enter", "NumpadEnter", " "].includes(e.key)) { e.preventDefault(); trigger("key:" + e.key); } });
$("orb").addEventListener("click", () => trigger("tap"));

window.santa = { startCall, endCall, status: () => state, config: CONFIG };
if (window.fully && typeof fully.bind === "function") { try { fully.bind("volumeUp", "window.santa.startCall('fully:volumeUp');"); } catch (e) {} }

meta();
setStatus("Tap once to open the line");
</script>
</body>
</html>
